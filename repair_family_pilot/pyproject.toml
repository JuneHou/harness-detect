[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "repair_family_pilot"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
  "numpy>=2.4",
  "scipy>=1.16",
  "pyarrow>=24",
  "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
